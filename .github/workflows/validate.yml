name: Validate and package plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests, connection and reminder
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('plugins/veloci')
          for path in pathlib.Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text())
          claude = json.loads((root / '.claude-plugin/plugin.json').read_text())
          codex = json.loads((root / '.codex-plugin/plugin.json').read_text())
          assert claude['name'] == codex['name'] == 'veloci'
          assert claude['version'] == codex['version']
          mcp = json.loads((root / '.mcp.json').read_text())['mcpServers']
          assert mcp == {'veloci': {'type': 'http', 'url': 'https://test.arcticrex.com/mcp/veloci'}}
          assert (root / 'skills/init/SKILL.md').is_file()
          assert not (root / 'skills/setup').exists()
          assert not (root / 'scripts/standalone-installer.py').exists()
          assert (root / 'scripts/remove-legacy-hooks.py').is_file()
          for helper in ('check.py', 'remove-legacy-hooks.py'):
              compile((root / 'scripts' / helper).read_text(), helper, 'exec')
          import tempfile
          with tempfile.TemporaryDirectory() as home:
              removal = ['python3', str(root / 'scripts/remove-legacy-hooks.py'), '--host', 'codex', '--home', home]
              assert subprocess.run(removal, capture_output=True).returncode != 0
              subprocess.run(removal + ['--remove'], check=True)
              assert not (pathlib.Path(home) / '.codex').exists()
          subprocess.run(['/bin/sh', '-n', str(root / 'hooks/session-start.sh')], check=True)
          output = subprocess.check_output(['/bin/sh', str(root / 'hooks/session-start.sh')], text=True)
          payload = json.loads(output)['hookSpecificOutput']
          assert payload['hookEventName'] == 'SessionStart'
          assert all(word in payload['additionalContext'] for word in ('start_task', 'complete_task', 'keep that ID bound'))
          assert 'Update the task only at the start and when the tracked work is actually complete, unless the user asks for an update.' in payload['additionalContext']
          assert all(phrase in payload['additionalContext'] for phrase in ('Reuse the bound task for related follow-ups', 'call reopen_task then start_task on that same ID', 'only for a distinct objective with no matching task'))
          print('Plugin manifests, beta endpoint, init skill and SessionStart payload validated')
          PY
      - name: Test release packaging
        run: python3 scripts/test_package.py
      - name: Package committed plugin files
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/package.py --tag "$REF_NAME"
          else
            python3 scripts/package.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: veloci-release
          path: dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: veloci-release
          path: dist
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
            --verify-tag --title "Veloci ${RELEASE_TAG#v}" --generate-notes
